services:
  - type: web
    name: lidar-adaptive-mapping-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: LIDAR_DEVICE
        value: cpu
      - key: LIDAR_DATA_DIR
        value: /app/data
      - key: LIDAR_CHECKPOINT_PATH
        value: /app/checkpoints/best_randlanet_real.pt
